services:
  db:
    image: postgres:16-alpine
    container_name: otklik-db
    environment:
      POSTGRES_USER: otklik
      POSTGRES_PASSWORD: "default_password"
      POSTGRES_DB: otklik
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otklik -d otklik"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: otklik-app
    environment:
      LISTEN_ADDR: ":8080"
      STAFF_LISTEN_ADDR: ":8081"
      DATABASE_URL: "postgres://otklik:default_password@db:5432/otklik?sslmode=disable"
      ATTACHMENTS_DIR: "/app/data/attachments"
      SESSION_TTL_MIN: "120"
      SEED_DEFAULT_PWD: "otklik-demo-2026"
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
